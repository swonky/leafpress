[package]
name = "leafpress"
version = "0.1.0"
edition = "2024"

[dependencies]
cairo-rs = { version = "0.22", features = ["svg"] }
libloading = "0.9"
pango = "0.22"
pangocairo = "0.22"
tree-sitter = "0.26.13"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
object = "0.40.0"
serde_json = "1.0.151"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
typify = "0.7"
prettyplease = "0.2"
syn = "2"

[dev-dependencies]
tree-sitter-go = "0.25"

[profile.release]
lto = true
codegen-units = 1
strip = true

